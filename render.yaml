services:
  - type: web
    name: niya-backend
    runtime: docker
    dockerfilePath: ./back-end/Dockerfile
    dockerContext: ./back-end
    plan: free
    # Only rebuild when this service's own code changes. Without this, every
    # commit to master redeploys the live API, including commits that only
    # touch an unrelated service.
    buildFilters:
      paths:
        - back-end/**
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: STORAGE_SERVICE
        value: cloudflare
      - key: SECRET_KEY_BASE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: VIDEOSDK_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false

  - type: web
    name: niya-practice
    runtime: docker
    dockerfilePath: ./niya-practice/Dockerfile
    dockerContext: ./niya-practice
    plan: free
    buildFilters:
      paths:
        - niya-practice/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: MYSQL_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        value: 3awQN3VvrGtuU5E.root
      - key: MYSQL_DATABASE
        value: niya_admin_db
      - key: MYSQL_POOL_SIZE
        value: "10"
      - key: NEXT_PUBLIC_APP_URL
        value: https://practice.niya.app
      - key: NEXT_PUBLIC_NIYA_URL
        value: https://niya.app
      - key: NEXTAUTH_URL
        value: https://practice.niya.app
      - key: AZURE_TTS_REGION
        value: centralindia
      - key: AZURE_TRANSLATOR_REGION
        value: centralindia
      - key: MYSQL_PASSWORD
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: AZURE_TTS_KEY
        sync: false
      - key: AZURE_TRANSLATOR_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GOOGLE_SA_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false

  # AI triage and matching. Standalone: its own `niyatriage` database, its own
  # accounts, no connection to niya-backend or niya_admin_db.
  - type: web
    name: niya-triage
    runtime: docker
    dockerfilePath: ./niya-triage-engine/Dockerfile
    dockerContext: ./niya-triage-engine
    plan: free
    healthCheckPath: /healthz
    buildFilters:
      paths:
        - niya-triage-engine/**
        - render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: BASE_URL
        value: https://niya-triage.onrender.com
      - key: SESSION_PRICE_MINOR
        value: "150000"
      - key: SESSION_CURRENCY
        value: INR
      # Points at the `niyatriage` database on the same TiDB Cloud cluster.
      # TiDB requires TLS, hence ssl_verify_cert:
      #   mysql+pymysql://USER:PASS@gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/niyatriage?ssl_verify_cert=true&ssl_verify_identity=true
      - key: DATABASE_URL
        sync: false
      # At least 32 characters. Changing it signs everybody out.
      - key: APP_SECRET_KEY
        generateValue: true
      # Absent until go-live, so payments stay simulated and no card is taken.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Absent until go-live, so messages queue and are visible in the app
      # rather than being sent.
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: hello@niya.app
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Twilio Programmable Video, the same product NIYA's web app uses. An API
      # key pair rather than the auth token, so it can be revoked on its own.
      # In the Rails app these are named CHAT_API_KEY and CHAT_API_SECRET.
      # Absent until go-live, so the session page stays an honest placeholder.
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false

  # Reminders. A cron job rather than a thread in the web service, because two
  # replicas would otherwise each send every reminder.
  - type: cron
    name: niya-triage-reminders
    runtime: docker
    dockerfilePath: ./niya-triage-engine/Dockerfile
    dockerContext: ./niya-triage-engine
    plan: starter
    schedule: "*/5 * * * *"
    dockerCommand: python scripts/send_due_notifications.py
    buildFilters:
      paths:
        - niya-triage-engine/**
        - render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: BASE_URL
        value: https://niya-triage.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: hello@niya.app
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
